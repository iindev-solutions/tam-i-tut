name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy to Cloudflare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Generate static build
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run generate

      # `nuxt generate` (cloudflare-module preset) also emits
      # .output/server/wrangler.json with main: index.mjs and Nitro writes a
      # redirect to it in frontend/.wrangler/deploy/config.json - wrangler
      # then deploys the server bundle instead of the static assets and fails
      # with "entry-point file at index.mjs was not found" (verified on run
      # 32357758921). Remove both so the repo-root wrangler.jsonc (static
      # assets, SPA fallback) is the only deploy config.
      - name: Remove Nitro server deploy state
        run: |
          rm -rf .output/server .wrangler/deploy
          ls .output/public/index.html

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
