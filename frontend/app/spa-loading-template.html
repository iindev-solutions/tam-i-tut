<div class="spa-loader" role="status" aria-label="TAMITUT loading">
  <svg class="spa-loader-logo" width="88" height="43" viewBox="0 0 419 201" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M182.306 200.757V149.952H86.7359L236.684 0.00330625L164.823 0.00936014L50.8052 114.021L50.8052 18.0038L7.98839e-06 18.0038L0 200.757L182.306 200.757Z" fill="currentColor"/>
    <path d="M236.649 7.96886e-06V50.8052L332.219 50.8052L182.271 200.753L254.132 200.739L368.15 86.7359V182.753H418.955V0L236.649 7.96886e-06Z" fill="currentColor"/>
  </svg>
  <script>
    try {
      var savedMode = localStorage.getItem('nuxt-color-mode')
      if (savedMode === 'dark') document.documentElement.classList.add('loader-dark')
      if (savedMode === 'light') document.documentElement.classList.add('loader-light')
    } catch (_) {}
  </script>
  <style>
    :root{color-scheme:dark}
    .spa-loader{position:fixed;inset:0;display:grid;place-items:center;background:#09090b;color:#fafafa}
    .spa-loader-logo{display:block;animation:tamitut-pulse 1.6s ease-in-out infinite;transform-origin:center}
    @keyframes tamitut-pulse{0%,100%{opacity:.52;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-color-scheme:light){:root:not(.loader-dark) .spa-loader{background:#fff;color:#18181b}}
    :root.loader-light{color-scheme:light}:root.loader-light .spa-loader{background:#fff;color:#18181b}
    @media (prefers-reduced-motion:reduce){.spa-loader-logo{animation:none;opacity:1;transform:none}}
  </style>
</div>
