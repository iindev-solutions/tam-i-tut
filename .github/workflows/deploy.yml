name: Deploy

# Single delivery pipeline: push to main = build + migrations + functions + frontend.
# Prod state must always equal git state; local deploys are a fallback, not the path.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_PROJECT_REF: tepsurbgsrivvcvizxph
  # Mapped to job env so steps can branch on presence (secrets are not
  # readable in `if:` conditions directly).
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    name: Build + Deploy (DB, Functions, Frontend)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      # Nitro cloudflare_module build: emits .output/server/index.mjs, which is
      # what frontend/wrangler.jsonc points at (main). The previous `generate`
      # + `rm -rf .output/server` dance shipped a DIFFERENT artifact (static
      # assets) than local deploys and contradicted the wrangler config.
      - name: Build
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.NUXT_PUBLIC_SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NUXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Verify Supabase config is baked in
        run: grep -q "supabaseUrl:\"https://" .output/server/chunks/_/nitro.mjs

      - name: Deploy frontend to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Migrations + functions deploy only with a SUPABASE_ACCESS_TOKEN repo
      # secret; until then they stay manual (db push / functions deploy from a
      # linked CLI) - visible here as skipped steps, not silent drift.
      # The job default working-directory is frontend/ - the Supabase CLI must
      # run from the repo root where supabase/ lives.
      - name: Apply database migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        working-directory: .
        run: npx -y supabase db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        working-directory: .
        run: |
          npx -y supabase functions deploy telegram-bootstrap --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx -y supabase functions deploy menu-translate --project-ref "$SUPABASE_PROJECT_REF"
          npx -y supabase functions deploy telegram-bot --project-ref "$SUPABASE_PROJECT_REF"
