<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;color:#18181b;font-family:Inter,Arial,sans-serif">
  <svg width="44" height="44" viewBox="0 0 48 48" fill="none" aria-hidden="true">
    <rect x="6" y="6" width="36" height="36" rx="12" fill="#18181b"/>
    <circle cx="20" cy="24" r="4" fill="#fff"/>
    <circle cx="28" cy="24" r="4" fill="#f97316"/>
  </svg>
  <div class="spa-loader-bar" style="width:120px;height:2px;border-radius:999px;background:#e4e4e7;overflow:hidden">
    <div style="width:40%;height:100%;border-radius:999px;background:#f97316;animation:tamitut-slide 1.2s ease-in-out infinite"></div>
  </div>
  <style>
    @keyframes tamitut-slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    @media (prefers-reduced-motion: reduce){.spa-loader-bar>div{animation:none;transform:none;width:100%}}
    @media (prefers-color-scheme: dark){body>div:first-child{background:#09090b!important;color:#fafafa!important}.spa-loader-bar{background:#27272a!important}}
  </style>
</div>
