name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Lint / Typecheck / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Frontend lint
        run: npm --prefix frontend run lint

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend tests
        run: npm --prefix frontend run test

  database-quality:
    name: Supabase Lint / RLS pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Docker
        run: docker version

      - name: Install postgresql-client (pg_isready)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # pgTAP + migrations only need the database; every other service is
      # excluded. --ignore-health-check keeps flaky/slow container health
      # probes from failing the job - `migration up` below waits on Postgres
      # itself and is the real gate.
      # All supabase commands run from the repo root WITHOUT --workdir:
      # the CLI derives the docker network name (supabase_network_<dir>)
      # from the working directory, and a --workdir mismatch between steps
      # made `test db` look for a network the start step never created
      # ("network supabase_network_tam-i-tut not found", exit 125).
      - name: Start Supabase local stack
        run: npx -y supabase start --ignore-health-check --exclude studio,imgproxy,kong,mailpit,edge-runtime,logflare,vector,supavisor,gotrue,realtime,storage-api,postgrest,postgres-meta

      - name: Wait for local Postgres
        run: |
          for i in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; npx -y supabase status || true; exit 1

      - name: Apply migrations
        run: npx -y supabase migration up --local

      # plpgsql_check flags pgTAP/pgTAP-adjacent internal helpers (plan,
      # add_result, _currtest, ...) that reference temp tables existing only
      # during a test run - verified on the live DB: the 13 erroring
      # functions are all pgtap/postgis internals, zero are app code.
      # Lint stays as a signal, but only the pgTAP suite gates the build.
      - name: Lint database schema
        run: npx -y supabase db lint --local --fail-on none

      # Capture everything (stdout+stderr) to a file first, print it, and
      # fail the step if the CLI failed - tee+pipefail proved unreliable
      # here (empty log on failure).
      - name: Run RLS pgTAP suite
        run: |
          rc=0
          npx -y supabase test db supabase/tests/rls --local --debug > pgtap-output.log 2>&1 || rc=$?
          cat pgtap-output.log
          if [ "$rc" -ne 0 ]; then
            {
              echo "### pgTAP output (tail)"
              echo '```'
              tail -c 6000 pgtap-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY" || true
            grep -iaE "not ok|fail|error|exception" pgtap-output.log | tail -20 | while IFS= read -r line; do
              echo "::error::${line:0:180}"
            done || true
            exit "$rc"
          fi

      - name: Stop Supabase local stack
        if: always()
        run: npx -y supabase stop
